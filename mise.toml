[tasks.generateDef]
description = "Builds raylib with Kotlin/Native's toolchain and generates its def file"
alias = "g"
run = "./kotlin task :raylib-kt:generate@build-plugin"
run_windows = "kotlin.bat task :raylib-kt:generate@build-plugin"

[tasks.build]
description = "Generates def file and then builds the project"
alias = "b"
depends = "generateDef"
run = "./kotlin build"
run_windows = "kotlin.bat build"

[tasks.publish]
description = "Publishes the package to maven central"
alias = "p"
env = { _.file = ".env" }
depends = "build"
run = "./kotlin task :raylib-kt:publishToMavenCentral"
run_windows = "echo Publishing macosArm64 artifacts must run on macOS; use the GitHub Actions publish workflow. && exit /b 1"

[tasks.publishLocal]
description = "Publishes the package to local maven"
alias = "pl"
env = { _.file = ".env" }
depends = "build"
run = "./kotlin publish mavenLocal"
run_windows = "echo Publishing macosArm64 artifacts must run on macOS; use the GitHub Actions publish workflow. && exit /b 1"
