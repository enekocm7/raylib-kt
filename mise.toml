[tasks.generateDef]
description = "Builds raylib with Kotlin/Native's toolchain and bundles its headers and static libraries"
alias = "g"
run = "kargo task raylib"

[tasks.build]
description = "Builds raylib and then builds the project"
alias = "b"
run = "kargo build"

[tasks.publish]
description = "Publishes the package to maven central"
alias = "p"
env = { _.file = ".env" }
depends = "build"
run = "kargo publish --locked --repository maven-central"

[tasks.publishLocal]
description = "Publishes the package to local maven"
alias = "pl"
env = { _.file = ".env" }
depends = "build"
run = "kargo publish --local"
