name: Publish

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    maven-central:
        name: Publish Maven Central
        runs-on: macos-15
        timeout-minutes: 60
        env:
            KARGO_MAVEN_CENTRAL_USERNAME: ${{ secrets.KARGO_MAVEN_CENTRAL_USERNAME }}
            KARGO_MAVEN_CENTRAL_PASSWORD: ${{ secrets.KARGO_MAVEN_CENTRAL_PASSWORD }}
            KARGO_SIGNING_KEY: ${{ secrets.KARGO_SIGNING_KEY }}
            KARGO_SIGNING_KEY_PASSPHRASE: ${{ secrets.KARGO_SIGNING_KEY_PASSPHRASE }}

        steps:
            - uses: actions/checkout@v5

            - name: Verify Apple Silicon runner
              run: test "$(uname -m)" = arm64

            - uses: enekocm7/kargo/setup-kargo@master

            - name: Install Kargo toolchains
              run: kargo toolchain install

            - name: Publish to Maven Central
              run: kargo publish --locked --repository maven-central
