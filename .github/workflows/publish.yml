name: Publish

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    maven-central:
        name: Publish Maven Central
        runs-on: macos-15
        timeout-minutes: 60
        env:
            KARGO_MAVEN_CENTRAL_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
            KARGO_MAVEN_CENTRAL_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
            KARGO_SIGNING_KEY: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
            KARGO_SIGNING_KEY_PASSPHRASE: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE }}

        steps:
            - uses: actions/checkout@v5

            - name: Verify Apple Silicon runner
              run: test "$(uname -m)" = arm64

            - uses: enekocm7/kargo/setup-kargo@master

            - name: Install Kargo toolchains
              run: kargo toolchain install

            # Kargo downloads Kotlin/Native's LLVM toolchain and sysroot on the first native build,
            # but the raylib task needs them before the project's own native build starts.
            - name: Provision Kotlin/Native toolchain
              shell: bash
              env:
                  KARGO_NATIVE_CACHE: "false"
              run: |
                  bootstrap_dir="$RUNNER_TEMP/konan-bootstrap"
                  mkdir -p "$bootstrap_dir/src"
                  printf '%s
                  ' '[package]' 'name = "bootstrap"' 'version = "0.1.0"' '[target.native]' 'platforms = ["host"]' > "$bootstrap_dir/kargo.toml"
                  printf '%s
                  ' 'fun main() = Unit' > "$bootstrap_dir/src/main.kt"
                  kargo build --manifest-path "$bootstrap_dir/kargo.toml"

            - name: Publish to Maven Central
              run: kargo publish --locked --repository maven-central
