name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KONAN_DATA_DIR: ${{ github.workspace }}/build/konan

    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - name: Provision Kotlin/Native toolchain
        run: |
          bootstrap_dir="$RUNNER_TEMP/konan-bootstrap"
          mkdir -p "$bootstrap_dir/src"
          printf '%s\n' 'product: linux/app' > "$bootstrap_dir/module.yaml"
          printf '%s\n' 'fun main() = Unit' > "$bootstrap_dir/src/main.kt"
          ./kotlin --shared-cache-dir "$RUNNER_TEMP/kotlin-cache" build --project-dir "$bootstrap_dir" --variant release

      - name: Generate raylib bindings
        run: ./kotlin --shared-cache-dir "$RUNNER_TEMP/kotlin-cache" task :raylib-kt:generate@build-plugin

      - name: Build Linux release
        run: ./kotlin --shared-cache-dir "$RUNNER_TEMP/kotlin-cache" task :raylib-kt:compileLinuxX64Release

  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      KONAN_DATA_DIR: ${{ github.workspace }}/build/konan

    steps:
      - uses: actions/checkout@v5

      - name: Provision Kotlin/Native toolchain
        shell: pwsh
        run: |
          $bootstrapDir = Join-Path $env:RUNNER_TEMP 'konan-bootstrap'
          New-Item -ItemType Directory -Force (Join-Path $bootstrapDir 'src') | Out-Null
          Set-Content -LiteralPath (Join-Path $bootstrapDir 'module.yaml') -Value 'product: windows/app'
          Set-Content -LiteralPath (Join-Path $bootstrapDir 'src/main.kt') -Value 'fun main() = Unit'
          .\kotlin.bat --shared-cache-dir "$env:RUNNER_TEMP\kotlin-cache" build --project-dir $bootstrapDir --variant release

      - name: Generate raylib bindings
        run: .\kotlin.bat --shared-cache-dir "$env:RUNNER_TEMP\kotlin-cache" task :raylib-kt:generate@build-plugin

      - name: Build Windows release
        run: .\kotlin.bat --shared-cache-dir "$env:RUNNER_TEMP\kotlin-cache" task :raylib-kt:compileMingwX64Release

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KONAN_DATA_DIR: ${{ github.workspace }}/build/konan

    steps:
      - uses: actions/checkout@v5

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Provision Kotlin/Native toolchain
        run: |
          bootstrap_dir="$RUNNER_TEMP/konan-bootstrap"
          mkdir -p "$bootstrap_dir/src"
          printf '%s\n' 'product: macos/app' > "$bootstrap_dir/module.yaml"
          printf '%s\n' 'fun main() = Unit' > "$bootstrap_dir/src/main.kt"
          ./kotlin --shared-cache-dir "$RUNNER_TEMP/kotlin-cache" build --project-dir "$bootstrap_dir" --variant release

      - name: Generate raylib bindings
        run: ./kotlin --shared-cache-dir "$RUNNER_TEMP/kotlin-cache" task :raylib-kt:generate@build-plugin

      - name: Build macOS ARM64 release
        run: ./kotlin --shared-cache-dir "$RUNNER_TEMP/kotlin-cache" task :raylib-kt:compileMacosArm64Release
