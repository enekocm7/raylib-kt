name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev

      - uses: enekocm7/kargo/setup-kargo@master

      # Kotlin/Native cannot generate Apple cinterop bindings off macOS
      - name: Limit targets to the host
        shell: bash
        run: sed -i.bak 's/, "macos_arm64"//' kargo.toml

      - name: Build Linux release
        run: kargo build --release

  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: enekocm7/kargo/setup-kargo@master

      # Kotlin/Native cannot generate Apple cinterop bindings off macOS
      - name: Limit targets to the host
        shell: bash
        run: sed -i.bak 's/, "macos_arm64"//' kargo.toml

      - name: Build Windows release
        run: kargo build --release

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - uses: enekocm7/kargo/setup-kargo@master

      - name: Build macOS ARM64 release
        run: kargo build --release --locked
